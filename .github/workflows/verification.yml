name: Formal Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      lean_changed: ${{ steps.changes.outputs.lean }}
      rocq_changed: ${{ steps.changes.outputs.rocq }}
      is_push: ${{ github.event_name == 'push' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Detect changed files
      id: changes
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "lean=true" >> $GITHUB_OUTPUT
          echo "rocq=true" >> $GITHUB_OUTPUT
          echo "Push to main - will verify ALL files"
        else
          LEAN_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.lean$|lakefile\.lean|lean-toolchain' || true)
          ROCQ_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.v$|_CoqProject' || true)

          if [ -n "$LEAN_CHANGED" ]; then
            echo "lean=true" >> $GITHUB_OUTPUT
            echo "Lean files changed:"
            echo "$LEAN_CHANGED"
          else
            echo "lean=false" >> $GITHUB_OUTPUT
            echo "No Lean files changed"
          fi

          if [ -n "$ROCQ_CHANGED" ]; then
            echo "rocq=true" >> $GITHUB_OUTPUT
            echo "Rocq files changed:"
            echo "$ROCQ_CHANGED"
          else
            echo "rocq=false" >> $GITHUB_OUTPUT
            echo "No Rocq files changed"
          fi
        fi

  file-size-check:
    name: File Size Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Check file size limits
      run: node scripts/check-file-size.mjs

  lean-verification:
    name: Lean Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.lean_changed == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Elan (Lean version manager)
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Verify Lean installation
      run: |
        lean --version
        lake --version

    - name: Cache Lean toolchain
      uses: actions/cache@v4
      with:
        path: |
          ~/.elan
        key: ${{ runner.os }}-lean-elan-v2-${{ hashFiles('drafts/0.0.3/src/lean/lakefile.lean') }}
        restore-keys: |
          ${{ runner.os }}-lean-elan-v2-

    - name: Clean stale build artifacts
      run: |
        echo "Cleaning .lake directory for fresh build..."
        rm -rf drafts/0.0.3/src/lean/.lake

    - name: Build and test Lean
      working-directory: drafts/0.0.3/src/lean
      run: |
        if [ -f "lakefile.lean" ]; then
          echo "=== Lean Verification ==="
          lean --version
          echo ""
          echo "Building Lean project..."
          lake build
          echo "Lean build completed successfully!"
        else
          echo "No Lean lakefile.lean - skipping"
        fi

  rocq-verification:
    name: Rocq Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.rocq_changed == 'true'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for Rocq files
      id: check-rocq
      run: |
        if [ -f "drafts/0.0.3/src/rocq/_CoqProject" ] || find drafts/0.0.3/src/rocq -name "*.v" -print -quit | grep -q .; then
          echo "has_files=true" >> $GITHUB_OUTPUT
        else
          echo "has_files=false" >> $GITHUB_OUTPUT
          echo "No Rocq files - skipping"
        fi

    - name: Fix permissions for docker
      if: steps.check-rocq.outputs.has_files == 'true'
      run: sudo chown -R 1000:1000 .

    - name: Build and test Rocq
      if: steps.check-rocq.outputs.has_files == 'true'
      uses: coq-community/docker-coq-action@v1
      with:
        custom_image: 'rocq/rocq-prover:9.1'
        custom_script: |
          startGroup "Rocq version"
            rocq --version
          endGroup
          startGroup "Verify Rocq files"
            cd drafts/0.0.3/src/rocq
            if [ -f "_CoqProject" ]; then
              echo "Building Rocq project with _CoqProject..."
              rocq makefile -f _CoqProject -o Makefile.coq
              make -f Makefile.coq
            else
              echo "Verifying Rocq files..."
              find . -name "*.v" -type f | while read -r file; do
                echo "Checking: $file"
                rocq compile "$file" && echo "$file verified successfully" || exit 1
              done
            fi
            echo "All Rocq files verified successfully!"
          endGroup

    - name: Revert permissions
      if: ${{ always() && steps.check-rocq.outputs.has_files == 'true' }}
      run: sudo chown -R 1001:116 .

